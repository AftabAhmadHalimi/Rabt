<!DOCTYPE html>
<html lang="en" data-theme="light" class="flow-motion">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.verify">Verify email — Rabط</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/navbar.css">
    <link rel="stylesheet" href="/brand.css">
    <link rel="stylesheet" href="/flow-motion.css">
    <script src="/i18n-dict.js"></script>
    <script src="/i18n.js"></script>
    <script src="/navbar.js"></script>
    <script src="/ui-feedback.js"></script>
    <script src="/flow-motion.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary); color: var(--text-primary); min-height: 100vh;
        }
        .wrap { max-width: 400px; margin: 16px auto; padding: 0 12px 24px; }
        .card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius); padding: 16px;
        }
        h1 { font-size: 20px; margin-bottom: 6px; }
        .hint { color: var(--text-secondary); font-size: 13px; line-height: 1.45; margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px 14px; margin-bottom: 14px; border-radius: 8px;
            border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary);
            font-size: 14px; outline: none;
        }
        .otp-input {
            letter-spacing: 0.42em;
            font-size: 26px;
            font-weight: 800;
            text-align: center;
            font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
            padding: 10px 12px;
        }
        .btn {
            width: 100%; padding: 13px; border: none; border-radius: 8px; cursor: pointer;
            font-weight: 700; background: var(--accent); color: #fff; font-size: 14px;
            font-family: inherit;
        }
        .switch { text-align: center; margin-top: 18px; color: var(--text-secondary); font-size: 14px; }
        .switch a { color: var(--text-primary); font-weight: 700; }
        .alert { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; }
        .alert.show { display: block; }
        .alert.ok { background: rgba(34,197,94,0.12); color: var(--success); }
        .alert.bad { background: rgba(239,68,68,0.12); color: var(--error); }
        .back { display: inline-flex; gap: 8px; align-items: center; color: var(--text-secondary); text-decoration: none; margin-bottom: 18px; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>
    <div id="app-navbar"></div>
    <div class="wrap">
        <a class="back" href="/login.html"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="verify.back">Back to sign in</span></a>
        <div class="card">
            <h1 data-i18n="verify.title">Enter code</h1>
            <p class="hint" id="hint" data-i18n="verify.hint">We emailed a verification link and a 6-digit code. Open the link or enter the code here. The code expires in 10 minutes.</p>
            <form id="verifyForm">
                <label for="email" data-i18n="login.email">Email</label>
                <input id="email" type="email" required placeholder="you@example.com" autocomplete="email">
                <label for="code" data-i18n="verify.code">Verification code</label>
                <input id="code" class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" required placeholder="000000" autocomplete="one-time-code">
                <button class="btn btn-primary" type="submit" data-i18n="verify.submit">Verify account</button>
            </form>
            <div class="alert" id="alertBox"></div>
            <p class="switch"><span data-i18n="verify.noCode">Didn't get the code?</span> <a href="#" id="resendLink" data-i18n="login.resend">Resend code</a></p>
            <p class="switch"><span data-i18n="verify.verified">Already verified?</span> <a href="/login.html" data-i18n="nav.signIn">Sign in</a></p>
        </div>
    </div>
    <script>
        var params = new URLSearchParams(window.location.search);
        var emailFromQuery = (params.get('email') || '').trim();
        var tokenFromQuery = (params.get('token') || '').trim();
        if (emailFromQuery) document.getElementById('email').value = emailFromQuery;

        document.addEventListener('auth-ready', function (e) {
            if (tokenFromQuery) return;
            var user = e.detail && e.detail.user;
            if (!user) return;
            window.location.replace(user.platformAccess ? '/' : (user.nextPath || '/pricing.html'));
        });

        var codeInput = document.getElementById('code');
        codeInput.addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '').slice(0, 6);
        });

        function showAlert(msg, ok) {
            var box = document.getElementById('alertBox');
            if (window.RabtUI) {
                RabtUI.notify(msg, ok ? 'success' : 'error', box);
                return;
            }
            box.className = 'alert show ' + (ok ? 'ok' : 'bad');
            box.textContent = msg;
        }

        function afterVerify(data) {
            document.getElementById('hint').textContent = 'Your email is verified. Opening pricing…';
            var go = function () {
                if (window.RabtRememberShell) window.RabtRememberShell(!!(data.user && data.user.platformAccess));
                window.location.replace(data.next || '/pricing.html');
            };
            if (window.RabtFlow && window.RabtFlow.celebrate) {
                window.RabtFlow.celebrate().then(go);
            } else {
                setTimeout(go, 500);
            }
        }

        async function submitVerify(payload) {
            var res = await fetch('/api/auth/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify(payload)
            });
            var data = await res.json();
            showAlert(data.message || (data.success ? 'Email verified.' : 'Verification failed'), !!data.success);
            if (data.success) afterVerify(data);
            return data;
        }

        if (tokenFromQuery) {
            submitVerify({ email: emailFromQuery, token: tokenFromQuery }).catch(function (err) {
                showAlert(err.message || 'Could not verify from this link.', false);
            });
        }

        document.getElementById('verifyForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            try {
                await submitVerify({
                    email: document.getElementById('email').value,
                    code: document.getElementById('code').value
                });
            } catch (err) {
                showAlert(err.message || 'Network error', false);
            }
        });

        document.getElementById('resendLink').addEventListener('click', async function (e) {
            e.preventDefault();
            try {
                var res = await fetch('/api/auth/resend-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email: document.getElementById('email').value })
                });
                var data = await res.json();
                showAlert(data.message || 'A new code is on its way.', !!data.success);
            } catch (err) {
                showAlert(err.message || 'Network error', false);
            }
        });
    </script>
</body>
</html>
