<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.language">Language — Rabط</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/navbar.css">
    <link rel="stylesheet" href="/brand.css">
    <script src="/i18n-dict.js"></script>
    <script src="/i18n.js"></script>
    <script src="/navbar.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary, #f3f5fa);
            color: var(--text-primary, #1e2540);
            min-height: 100vh;
        }
        .lang-shell {
            min-height: calc(100vh - var(--app-header-height, 68px));
            min-height: calc(100dvh - var(--app-header-height, 68px));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 16px 32px;
        }
        .lang-page {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            text-align: center;
        }
        .lang-page h1 { font-size: 22px; margin-bottom: 8px; letter-spacing: -0.02em; }
        .lang-page .lead {
            color: var(--text-secondary, #6b7389);
            font-size: 14px;
            line-height: 1.55;
            margin: 0 auto 18px;
            max-width: 520px;
        }
        .lang-grid {
            display: grid;
            gap: 12px;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }
        .lang-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            text-align: start;
            border: 1px solid var(--border-color, #e6eaf2);
            background: var(--bg-card, #fff);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            font-family: inherit;
            color: inherit;
        }
        .lang-card:hover { border-color: #5B4FFF; }
        .lang-card.active { border-color: #5B4FFF; box-shadow: 0 0 0 3px rgba(91,79,255,0.15); }
        .lang-card strong { display: block; font-size: 14px; }
        .lang-card span { display: block; font-size: 13px; color: var(--text-secondary, #6b7389); margin-top: 4px; }
        .lang-card em {
            font-style: normal;
            font-size: 12px;
            font-weight: 800;
            color: #5B4FFF;
            white-space: nowrap;
        }
        html.app-shell .lang-shell {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: flex-start !important;
            min-height: calc(100dvh - var(--app-header-height, 68px)) !important;
            padding: 16px 16px 32px !important;
        }
        html.app-shell .lang-page {
            max-width: 560px !important;
            width: 100% !important;
            margin: 0 auto !important;
            padding: 0 !important;
            text-align: center !important;
        }
        html.app-shell .lang-page .lead {
            margin-left: auto !important;
            margin-right: auto !important;
        }
        html.app-shell .lang-grid {
            max-width: 520px !important;
            margin-left: auto !important;
            margin-right: auto !important;
        }
    </style>
</head>
<body>
    <div id="app-navbar"></div>
    <div class="lang-shell">
        <div class="lang-page">
            <h1 data-i18n="lang.title">Choose app language</h1>
            <p class="lead" data-i18n="lang.lead">Pick the language for menus, buttons, and every page in the workspace. Your choice is saved on this device.</p>
            <div class="lang-grid" id="langGrid"></div>
        </div>
    </div>
    <script>
        (function () {
            var i18n = window.RabtI18n;
            if (!i18n) return;
            var grid = document.getElementById('langGrid');

            function render() {
                var current = i18n.get();
                grid.innerHTML = i18n.langs.map(function (lang) {
                    var active = lang.id === current ? ' active' : '';
                    var using = lang.id === current
                        ? '<em>' + i18n.t('lang.using') + '</em>'
                        : '';
                    return '<button type="button" class="lang-card' + active + '" data-lang="' + lang.id + '">' +
                        '<div><strong>' + lang.native + '</strong><span>' + lang.name + '</span></div>' +
                        using +
                        '</button>';
                }).join('');
                grid.querySelectorAll('[data-lang]').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        i18n.set(btn.getAttribute('data-lang'));
                        window.location.reload();
                    });
                });
            }

            document.addEventListener('auth-ready', render);
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', render);
            } else {
                render();
            }
        })();
    </script>
</body>
</html>
