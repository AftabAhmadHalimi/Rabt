<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified Contact — Rabط</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/navbar.css">
    <link rel="stylesheet" href="/brand.css">
    <script src="/i18n-dict.js"></script>
    <script src="/i18n.js"></script>
    <script src="/navbar.js"></script>
    <script src="/ui-feedback.js"></script>
    <script src="/saved-lists.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .container { max-width: 1040px; margin: 0 auto; padding: 16px 16px 24px; }
        .back-link {
            display: flex;
            width: fit-content;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin: 0 auto 12px;
        }
        .page-header { margin-bottom: 16px; text-align: center; }
        .page-header h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .page-header p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.55;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px 16px;
        }
        .kind-note { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 14px; }
        .verified-toolbar {
            display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap;
        }
        .form-input {
            width: 100%; padding: 12px 14px; font-size: 14px;
            border: 1px solid var(--border-color); border-radius: 8px;
            background: var(--bg-secondary); color: var(--text-primary);
        }
        .verified-search { flex: 1; min-width: 220px; }
        .verified-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .stat-chip {
            font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px;
            background: var(--bg-tertiary); border: 1px solid var(--border-color); color: var(--text-secondary);
        }
        .segmented {
            display: inline-flex; align-items: center;
            background: var(--bg-tertiary); border: 1.5px solid var(--accent);
            border-radius: 8px; padding: 3px; gap: 2px;
        }
        .verified-filter {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            height: 32px; border: 0; border-radius: 6px; background: transparent;
            color: var(--text-secondary); cursor: pointer; font-family: inherit;
            font-weight: 650; font-size: 12px; padding: 0 12px; white-space: nowrap;
        }
        .verified-filter.active { background: var(--accent); color: #fff; }
        .action-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 11px 16px; border: none; border-radius: 8px; cursor: pointer;
            font-weight: 600; font-size: 13px; font-family: inherit;
        }
        .btn-action {
            background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color);
        }
        .btn-action.danger { color: var(--error); border-color: rgba(239,68,68,0.35); }
        .btn-action.email { color: #fff; background: var(--accent); border-color: var(--accent); }
        .btn-action.whatsapp { color: #fff; background: var(--whatsapp); border-color: var(--whatsapp); }
        .btn-action.telegram { color: #fff; background: var(--telegram); border-color: var(--telegram); }
        .verified-columns {
            display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start;
        }
        .verified-section-title {
            font-size: 13px; font-weight: 700; display: flex; align-items: center;
            justify-content: space-between; gap: 8px; margin-bottom: 6px;
        }
        .verified-section-title i { color: var(--accent); }
        .verified-section.phone .verified-section-title i { color: var(--whatsapp); }
        .verified-list { border-top: 1px solid var(--border-color); }
        .contact-card {
            border-bottom: 1px solid var(--border-color); padding: 8px 4px;
            display: flex; align-items: center; gap: 10px;
        }
        .contact-check { width: 16px; height: 16px; accent-color: var(--accent); }
        .contact-avatar {
            width: 28px; height: 28px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-tertiary); color: var(--accent); font-size: 12px;
        }
        .contact-card.phone .contact-avatar { color: var(--whatsapp); }
        .contact-body { min-width: 0; flex: 1; }
        .contact-value { font-size: 13px; font-weight: 600; word-break: break-all; }
        .contact-meta-row { font-size: 11px; color: var(--text-secondary); margin-top: 2px; line-height: 1.3; }
        .check-label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .list-empty {
            text-align: center; color: var(--text-secondary); font-size: 13px; padding: 28px 8px;
        }
        .list-empty i { display: block; font-size: 24px; margin-bottom: 8px; color: var(--text-muted); }
        @media (max-width: 768px) {
            .verified-toolbar { flex-direction: column; align-items: stretch; }
            .segmented { width: 100%; }
            .verified-filter { flex: 1; }
            .verified-columns { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="app-navbar"></div>
    <div class="container">
        <a class="back-link" href="/import-export.html"><i class="fa-solid fa-arrow-left"></i> Back to Contact</a>
        <div class="page-header">
            <h1><i class="fa-solid fa-user-check"></i> Verified Contact</h1>
            <p>Every valid email and phone number from your uploaded lists, with source details. Invalid and duplicate rows stay out of this directory.</p>
        </div>
        <section class="card">
            <div class="verified-stats" id="verifiedStats"></div>
            <div class="verified-toolbar">
                <input id="verifiedSearch" class="form-input verified-search" type="search" placeholder="Search email, phone, or list name">
                <div class="segmented" role="group" aria-label="Filter contacts">
                    <button type="button" class="verified-filter active" data-filter="all"><i class="fa-solid fa-layer-group"></i> All</button>
                    <button type="button" class="verified-filter" data-filter="email"><i class="fa-solid fa-envelope"></i> Email</button>
                    <button type="button" class="verified-filter" data-filter="phone"><i class="fa-solid fa-phone"></i> Phone</button>
                </div>
            </div>
            <div class="action-bar">
                <button type="button" class="btn btn-action danger" id="verifiedDeleteBtn"><i class="fa-solid fa-trash"></i> Delete</button>
                <button type="button" class="btn btn-action email" id="verifiedSendEmail"><i class="fa-solid fa-envelope"></i> Send Email</button>
                <button type="button" class="btn btn-action whatsapp" id="verifiedSendWhatsapp"><i class="fa-brands fa-whatsapp"></i> Send WhatsApp</button>
                <button type="button" class="btn btn-action telegram" id="verifiedSendTelegram"><i class="fa-brands fa-telegram"></i> Send Telegram</button>
            </div>
            <div id="verifiedItems"></div>
        </section>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var verifiedItems = document.getElementById('verifiedItems');
            var verifiedStats = document.getElementById('verifiedStats');
            var verifiedSearch = document.getElementById('verifiedSearch');
            var verifiedFilter = 'all';
            var cached = { email: [], messaging: [] };
            var selectedContacts = {};

            function notify(msg, isError) {
                if (window.RabtUI) RabtUI.toast(msg, isError ? 'error' : 'success');
            }

            function formatDate(value) {
                if (!value) return '';
                try { return new Date(value).toLocaleString(); } catch (_) { return ''; }
            }

            function contactKey(type, value) {
                return type + ':' + String(value || '').toLowerCase();
            }

            function selectedContactValues(type) {
                return Object.keys(selectedContacts).filter(function (key) {
                    return selectedContacts[key] && key.indexOf(type + ':') === 0;
                }).map(function (key) { return key.slice(type.length + 1); });
            }

            function stashAndGo(channel, values) {
                if (!values.length) {
                    notify(channel === 'email' ? 'Select email contacts first.' : 'Select phone numbers first.', true);
                    return;
                }
                try {
                    sessionStorage.setItem('rabtSelectedRecipients', JSON.stringify({ channel: channel, values: values }));
                } catch (_) {}
                window.location.href = channel === 'email' ? '/email.html' : (channel === 'whatsapp' ? '/whatsapp.html' : '/telegram.html');
            }

            function collectVerified() {
                var byKey = {};
                function add(list, type) {
                    (list.contacts || []).forEach(function (value) {
                        var key = type + ':' + String(value).toLowerCase();
                        if (!byKey[key]) {
                            byKey[key] = { value: value, type: type, lists: [], files: [], dates: [] };
                        }
                        var row = byKey[key];
                        if (list.name && row.lists.indexOf(list.name) === -1) row.lists.push(list.name);
                        if (list.originalName && row.files.indexOf(list.originalName) === -1) row.files.push(list.originalName);
                        if (list.createdAt) row.dates.push(list.createdAt);
                    });
                }
                cached.email.forEach(function (list) { add(list, 'email'); });
                cached.messaging.forEach(function (list) { add(list, 'phone'); });
                return Object.keys(byKey).map(function (key) { return byKey[key]; }).sort(function (a, b) {
                    if (a.type !== b.type) return a.type === 'email' ? -1 : 1;
                    return String(a.value).localeCompare(String(b.value));
                });
            }

            function latestDate(dates) {
                if (!dates || !dates.length) return '';
                return dates.slice().sort().reverse()[0];
            }

            function renderVerified() {
                var all = collectVerified();
                var query = (verifiedSearch.value || '').trim().toLowerCase();
                var visible = all.filter(function (item) {
                    if (verifiedFilter !== 'all' && item.type !== verifiedFilter) return false;
                    if (!query) return true;
                    var hay = [item.value, item.lists.join(' '), item.files.join(' ')].join(' ').toLowerCase();
                    return hay.indexOf(query) !== -1;
                });
                var emailCount = all.filter(function (item) { return item.type === 'email'; }).length;
                var phoneCount = all.filter(function (item) { return item.type === 'phone'; }).length;
                verifiedStats.innerHTML =
                    '<span class="stat-chip">' + all.length + ' verified</span>' +
                    '<span class="stat-chip">' + emailCount + ' email</span>' +
                    '<span class="stat-chip">' + phoneCount + ' phone</span>';
                if (!visible.length) {
                    verifiedItems.innerHTML = '<div class="list-empty"><i class="fa-solid fa-address-book"></i>No verified contacts yet. Upload a list on Contact first.</div>';
                    return;
                }
                function rowHtml(item) {
                    var isEmail = item.type === 'email';
                    var type = isEmail ? 'email' : 'phone';
                    var meta = [
                        isEmail ? 'Email' : 'Phone',
                        isEmail ? 'Email campaigns' : 'WhatsApp / Telegram',
                        item.lists.join(', ') || 'Untitled list',
                        item.files.join(', ') || '',
                        formatDate(latestDate(item.dates))
                    ].filter(Boolean).join(' · ');
                    return (
                        '<div class="contact-card ' + (isEmail ? 'email' : 'phone') + '">' +
                            '<input type="checkbox" class="contact-check" data-type="' + type + '" data-value="' + RabtLists.escapeHtml(item.value) + '"' +
                                (selectedContacts[contactKey(type, item.value)] ? ' checked' : '') + '>' +
                            '<div class="contact-avatar"><i class="fa-solid ' + (isEmail ? 'fa-envelope' : 'fa-phone') + '"></i></div>' +
                            '<div class="contact-body">' +
                                '<div class="contact-value">' + RabtLists.escapeHtml(item.value) + '</div>' +
                                '<div class="contact-meta-row">' + RabtLists.escapeHtml(meta) + '</div>' +
                            '</div>' +
                        '</div>'
                    );
                }
                function sectionHtml(title, icon, extraClass, type, items) {
                    var allSelected = items.length > 0 && items.every(function (item) {
                        return !!selectedContacts[contactKey(type, item.value)];
                    });
                    var body = items.length
                        ? '<div class="verified-list">' + items.map(rowHtml).join('') + '</div>'
                        : '<div class="list-empty">No ' + title.toLowerCase() + ' yet.</div>';
                    return (
                        '<section class="verified-section ' + extraClass + '">' +
                            '<div class="verified-section-title">' +
                                '<span><i class="fa-solid ' + icon + '"></i> ' + title + ' · ' + items.length + '</span>' +
                                '<label class="check-label"><input type="checkbox" class="section-select-all" data-type="' + type + '"' +
                                    (allSelected ? ' checked' : '') + (items.length ? '' : ' disabled') + '> Select all</label>' +
                            '</div>' + body +
                        '</section>'
                    );
                }
                var emails = visible.filter(function (item) { return item.type === 'email'; });
                var phones = visible.filter(function (item) { return item.type === 'phone'; });
                verifiedItems.innerHTML =
                    '<div class="verified-columns">' +
                        sectionHtml('Email', 'fa-envelope', '', 'email', emails) +
                        sectionHtml('Phone Number', 'fa-phone', 'phone', 'phone', phones) +
                    '</div>';
            }

            async function loadLists() {
                cached.email = await RabtLists.load('email');
                cached.messaging = await RabtLists.load('messaging');
                renderVerified();
            }

            verifiedSearch.addEventListener('input', renderVerified);
            document.querySelectorAll('.verified-filter').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    verifiedFilter = btn.getAttribute('data-filter') || 'all';
                    document.querySelectorAll('.verified-filter').forEach(function (el) {
                        el.classList.toggle('active', el === btn);
                    });
                    renderVerified();
                });
            });

            function syncSectionSelectAll(type) {
                var header = document.querySelector('.section-select-all[data-type="' + type + '"]');
                var boxes = document.querySelectorAll('.contact-check[data-type="' + type + '"]');
                if (!header || !boxes.length) { if (header) header.checked = false; return; }
                header.checked = Array.prototype.every.call(boxes, function (box) { return box.checked; });
            }

            verifiedItems.addEventListener('change', function (e) {
                var sectionAll = e.target.closest('.section-select-all');
                if (sectionAll) {
                    var type = sectionAll.getAttribute('data-type');
                    document.querySelectorAll('.contact-check[data-type="' + type + '"]').forEach(function (box) {
                        box.checked = sectionAll.checked;
                        selectedContacts[contactKey(type, box.getAttribute('data-value'))] = sectionAll.checked;
                    });
                    return;
                }
                var box = e.target.closest('.contact-check');
                if (!box) return;
                var contactType = box.getAttribute('data-type');
                selectedContacts[contactKey(contactType, box.getAttribute('data-value'))] = box.checked;
                syncSectionSelectAll(contactType);
            });

            document.getElementById('verifiedDeleteBtn').addEventListener('click', async function () {
                var emails = selectedContactValues('email');
                var phones = selectedContactValues('phone');
                if (!emails.length && !phones.length) {
                    notify('Select contacts first.', true);
                    return;
                }
                var ok = await RabtUI.confirm({
                    title: 'Delete selected contacts?',
                    message: 'This removes them from your saved lists.',
                    confirmLabel: 'Delete',
                    danger: true
                });
                if (!ok) return;
                try {
                    var res = await fetch('/api/lists/remove-contacts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'same-origin',
                        body: JSON.stringify({ emails: emails, phones: phones })
                    });
                    var data = await res.json().catch(function () { return {}; });
                    if (!res.ok) throw new Error(data.message || 'Could not delete.');
                    selectedContacts = {};
                    notify('Selected contacts deleted.');
                    await loadLists();
                } catch (err) {
                    notify(err.message || 'Could not delete.', true);
                }
            });
            document.getElementById('verifiedSendEmail').addEventListener('click', function () {
                stashAndGo('email', selectedContactValues('email'));
            });
            document.getElementById('verifiedSendWhatsapp').addEventListener('click', function () {
                stashAndGo('whatsapp', selectedContactValues('phone'));
            });
            document.getElementById('verifiedSendTelegram').addEventListener('click', function () {
                stashAndGo('telegram', selectedContactValues('phone'));
            });

            loadLists().catch(function (err) { notify(err.message, true); });
        });
    </script>
</body>
</html>
