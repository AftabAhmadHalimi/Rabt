<!DOCTYPE html>
<html lang="en" data-theme="light" class="flow-motion">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.forgot">Forgot password — Rabط</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/navbar.css">
    <link rel="stylesheet" href="/brand.css">
    <link rel="stylesheet" href="/flow-motion.css">
    <script src="/i18n-dict.js"></script>
    <script src="/i18n.js"></script>
    <script src="/navbar.js"></script>
    <script src="/ui-feedback.js"></script>
    <script src="/flow-motion.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary); color: var(--text-primary); min-height: 100vh;
        }
        .wrap { max-width: 400px; margin: 16px auto; padding: 0 12px 24px; }
        .card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius); padding: 16px;
        }
        h1 { font-size: 20px; margin-bottom: 6px; }
        .hint { color: var(--text-secondary); font-size: 13px; line-height: 1.45; margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px 14px; margin-bottom: 14px; border-radius: 8px;
            border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary);
            font-size: 14px; outline: none;
        }
        input[readonly] { opacity: 0.85; cursor: default; }
        .otp-input {
            letter-spacing: 0.42em;
            font-size: 26px;
            font-weight: 800;
            text-align: center;
            font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
            padding: 10px 12px;
        }
        .btn {
            width: 100%; padding: 13px; border: none; border-radius: 8px; cursor: pointer;
            font-weight: 700; background: var(--accent); color: #fff; font-size: 14px;
            font-family: inherit;
        }
        .btn-ghost {
            margin-top: 10px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .switch { text-align: center; margin-top: 18px; color: var(--text-secondary); font-size: 14px; }
        .switch a { color: var(--text-primary); font-weight: 700; }
        .alert { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; }
        .alert.show { display: block; }
        .alert.ok { background: rgba(34,197,94,0.12); color: var(--success); }
        .alert.bad { background: rgba(239,68,68,0.12); color: var(--error); }
        .back { display: inline-flex; gap: 8px; align-items: center; color: var(--text-secondary); text-decoration: none; margin-bottom: 18px; font-weight: 600; font-size: 14px; }
        .step { display: none; }
        .step.active { display: block; }
    </style>
</head>
<body>
    <div id="app-navbar"></div>
    <div class="wrap">
        <a class="back" href="/login.html"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="forgot.back">Back to sign in</span></a>
        <div class="card">
            <div id="stepRequest" class="step active">
                <h1 data-i18n="forgot.title">Forgot password</h1>
                <p class="hint" data-i18n="forgot.hint">Enter your account email. We will send a 6-digit code to reset your password.</p>
                <form id="requestForm">
                    <label for="emailRequest" data-i18n="login.email">Email</label>
                    <input id="emailRequest" type="email" required placeholder="you@example.com" autocomplete="email">
                    <button class="btn btn-primary" type="submit" data-i18n="forgot.sendCode">Send reset code</button>
                </form>
            </div>
            <div id="stepReset" class="step">
                <h1 data-i18n="forgot.resetTitle">Set new password</h1>
                <p class="hint" id="resetHint" data-i18n="forgot.resetHint">Enter the 6-digit code from your email and choose a new password.</p>
                <form id="resetForm">
                    <label for="emailReset" data-i18n="login.email">Email</label>
                    <input id="emailReset" type="email" readonly autocomplete="email">
                    <label for="code" data-i18n="forgot.code">Reset code</label>
                    <input id="code" class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" required placeholder="000000" autocomplete="one-time-code">
                    <label for="newPassword" data-i18n="forgot.newPassword">New password</label>
                    <input id="newPassword" type="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
                    <label for="confirmPassword" data-i18n="forgot.confirmPassword">Confirm password</label>
                    <input id="confirmPassword" type="password" required minlength="6" placeholder="Repeat password" autocomplete="new-password">
                    <button class="btn btn-primary" type="submit" data-i18n="forgot.submit">Update password</button>
                    <button class="btn btn-ghost" type="button" id="resendBtn" data-i18n="login.resend">Resend code</button>
                </form>
            </div>
            <div class="alert" id="alertBox"></div>
            <p class="switch"><span data-i18n="forgot.remember">Remember your password?</span> <a href="/login.html" data-i18n="nav.signIn">Sign in</a></p>
        </div>
    </div>
    <script>
        var params = new URLSearchParams(window.location.search);
        var emailFromQuery = (params.get('email') || '').trim();
        if (emailFromQuery) document.getElementById('emailRequest').value = emailFromQuery;

        var currentEmail = '';

        function showAlert(msg, ok) {
            var box = document.getElementById('alertBox');
            if (window.RabtUI) {
                RabtUI.notify(msg, ok ? 'success' : 'error', box);
                return;
            }
            box.className = 'alert show ' + (ok ? 'ok' : 'bad');
            box.textContent = msg;
        }

        function showStep(step) {
            document.getElementById('stepRequest').classList.toggle('active', step === 'request');
            document.getElementById('stepReset').classList.toggle('active', step === 'reset');
        }

        document.getElementById('code').addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '').slice(0, 6);
        });

        document.getElementById('requestForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            var email = document.getElementById('emailRequest').value.trim();
            try {
                var res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email: email })
                });
                var data = await res.json();
                showAlert(data.message || (data.success ? 'Reset code sent.' : 'Could not send code.'), !!data.success);
                if (data.success) {
                    currentEmail = email;
                    document.getElementById('emailReset').value = email;
                    showStep('reset');
                }
            } catch (err) {
                showAlert(err.message || 'Network error', false);
            }
        });

        document.getElementById('resetForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            try {
                var res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        email: document.getElementById('emailReset').value.trim(),
                        code: document.getElementById('code').value,
                        password: document.getElementById('newPassword').value,
                        confirmPassword: document.getElementById('confirmPassword').value
                    })
                });
                var data = await res.json();
                showAlert(data.message || (data.success ? 'Password updated.' : 'Reset failed.'), !!data.success);
                if (data.success) {
                    setTimeout(function () {
                        window.location.href = '/login.html?reset=1';
                    }, 900);
                }
            } catch (err) {
                showAlert(err.message || 'Network error', false);
            }
        });

        document.getElementById('resendBtn').addEventListener('click', async function () {
            var email = document.getElementById('emailReset').value.trim() || currentEmail;
            if (!email) return;
            try {
                var res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email: email })
                });
                var data = await res.json();
                showAlert(data.message || 'A new code is on its way.', !!data.success);
            } catch (err) {
                showAlert(err.message || 'Network error', false);
            }
        });
    </script>
</body>
</html>
