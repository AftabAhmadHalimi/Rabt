# Rabط production reverse proxy
# Replace YOUR_DOMAIN and the certificate paths. Do not commit real certs or keys.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # ssl_certificate     /path/to/YOUR_DOMAIN.crt;
    # ssl_certificate_key /path/to/YOUR_DOMAIN.key;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 25m;

    location ^~ /config { return 404; }
    location ^~ /storage { return 404; }
    location ^~ /backups { return 404; }
    location ^~ /.env { return 404; }
    location ^~ /.git { return 404; }
    location ^~ /node_modules { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 300s;
    }
}
